spring.application.name=BackWeBuild


# --- PostgreSQL Configuration ---
# ATENÇÃO: Altere 'webuild_db', 'webuild_user' e 'your_secure_password' para suas credenciais reais.
spring.datasource.url=jdbc:postgresql://localhost:5432/webuild_db
spring.datasource.username=webuild_user
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate Configuration ---
# 'update' criará as tabelas automaticamente se não existirem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect